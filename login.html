<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-black text-light">

    <main class="container-fluid min-vh-100 d-flex
                 justify-content-center align-items-center p-3">

        <div class="container-xl">

            <div class="row g-0 rounded-4 border
                        border-secondary shadow-lg overflow-hidden">

                <div class="col-md-6 bg-dark-subtle p-4 p-lg-5
                            d-flex flex-column">

                    <img src="images/logo.png" alt="ThirdSpace Logo" class="img-fluid align-self-start" width="260">

                    <div class="d-flex justify-content-center
                                align-items-center flex-grow-1 py-4">

                        <img src="images/illustration.png" alt="ThirdSpace Illustration" class="img-fluid" width="470">

                    </div>

                </div>

                <div class="col-md-6 bg-body-tertiary p-4 p-lg-5
                            d-flex flex-column justify-content-center">

                    <div class="row justify-content-center">
                        <div class="col-lg-10">

                            <h1 class="fw-bold mb-2">
                                Welcome Back
                            </h1>

                            <p class="text-secondary mb-4">
                                Log in to your ThirdSpace account
                            </p>

                            <form>

                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        Email Address
                                    </label>

                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="Enter your email" autocomplete="email" required>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label">
                                        Password
                                    </label>

                                    <input type="password" class="form-control" id="password" name="password"
                                        placeholder="Enter your password" autocomplete="current-password" required>
                                </div>

                                <a href="home.html" class="btn btn-info w-100 py-2 fw-semibold">
                                    Log In
                                </a>

                            </form>

                            <p class="text-center mt-4 mb-0">
                                New here?
                                <a href="signup.html" class="link-info text-decoration-none">
                                    Create Account
                                </a>
                            </p>

                        </div>
                    </div>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
