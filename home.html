<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-black text-light">

    <header class="navbar bg-dark border-bottom border-secondary px-4 py-1">

        <a href="home.html" class="navbar-brand">
            <img src="images/logo.png" alt="ThirdSpace Logo" width="150">
        </a>

        <div class="d-flex align-items-center gap-4">

            <a href="#" class="text-light fs-4" aria-label="Notifications">
                <i class="bi bi-bell"></i>
            </a>

            <div class="dropdown">

                <button class="btn btn-dark rounded-circle" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false" aria-label="Profile menu">
                    <i class="bi bi-person-circle fs-4"></i>
                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a class="dropdown-item" href="#">
                            View Profile
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item" href="#">
                            Friends & Requests
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item" href="#">
                            Edit Profile
                        </a>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <a class="dropdown-item" href="login.html">
                            Log Out
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </header>


    <div class="container-fluid px-0">
        <div class="row g-0">

            <aside class="col-md-3 col-lg-2 bg-dark border-end border-secondary min-vh-100 px-2 py-3">

                <nav class="nav flex-column gap-2">

                    <a href="home.html" class="nav-link active bg-info bg-opacity-25 text-info rounded-3 py-3"
                        aria-current="page">

                        <i class="bi bi-house-door-fill me-3"></i>
                        Home
                    </a>

                    <a href="#" class="nav-link text-light rounded-3 py-3">

                        <i class="bi bi-compass me-3"></i>
                        Explore
                    </a>

                    <a href="#" class="nav-link text-light rounded-3 py-3">

                        <i class="bi bi-people me-3"></i>
                        Communities
                    </a>

                    <a href="#" class="nav-link text-light rounded-3 py-3">

                        <i class="bi bi-shop me-3"></i>
                        Marketplace
                    </a>

                </nav>

            </aside>


            <main class="col-md-9 col-lg-10 p-4">

                <section class="card bg-dark border-secondary rounded-4 mb-3">

                    <div class="card-body p-3">

                        <h6 class="fw-semibold mb-3">
                            Stories
                        </h6>

                        <div class="d-flex align-items-start gap-3">

                            <!-- Add Story -->
                            <div class="text-center flex-shrink-0">

                                <button type="button" class="btn btn-outline-info rounded-circle p-3"
                                    aria-label="Add story">

                                    <i class="bi bi-plus-lg fs-4"></i>

                                </button>

                                <small class="d-block mt-2">
                                    Your Story
                                </small>

                            </div>

                        </div>

                    </div>

                </section>


                <section class="card bg-dark border-secondary rounded-4 mb-3">

                    <div class="card-body p-3">

                        <div class="d-flex align-items-center gap-3">

                            <i class="bi bi-person-circle fs-1 text-secondary"></i>

                            <button type="button" class="btn btn-secondary rounded-pill text-start flex-grow-1"
                                data-bs-toggle="modal" data-bs-target="#createPostModal">

                                What's on your mind?

                            </button>

                        </div>

                        <hr class="border-secondary">

                        <div class="row g-2 text-center">

                            <div class="col-6">

                                <button type="button" class="btn btn-dark w-100" data-bs-toggle="modal"
                                    data-bs-target="#createPostModal">

                                    <i class="bi bi-image text-info me-2"></i>
                                    Add Photos

                                </button>

                            </div>

                            <div class="col-6">

                                <button type="button" class="btn btn-dark w-100" data-bs-toggle="modal"
                                    data-bs-target="#createPostModal">

                                    <i class="bi bi-file-text text-info me-2"></i>
                                    Text Post

                                </button>

                            </div>

                        </div>

                    </div>

                </section>


                <section class="text-center py-5">

                    <i class="bi bi-newspaper display-4 text-secondary"></i>

                    <h5 class="fw-semibold mt-3">
                        No posts yet
                    </h5>

                    <p class="text-secondary">
                        Posts from your friends will appear here.
                    </p>

                </section>

            </main>

        </div>
    </div>


    <div class="modal fade" id="createPostModal" tabindex="-1" aria-labelledby="createPostTitle" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content bg-dark text-light">

                <div class="modal-header border-secondary">

                    <h5 class="modal-title" id="createPostTitle">
                        Create Post
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>

                </div>

                <div class="modal-body">

                    <label for="postText" class="form-label">
                        What's on your mind?
                    </label>

                    <textarea class="form-control mb-3" id="postText" rows="4"
                        placeholder="Write something..."></textarea>

                    <label for="postImages" class="form-label">
                        Add Photos (Optional)
                    </label>

                    <input type="file" class="form-control" id="postImages" accept="image/*" multiple>

                </div>

                <div class="modal-footer border-secondary">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="button" class="btn btn-info">
                        Post
                    </button>

                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
